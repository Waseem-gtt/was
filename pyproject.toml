[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "was-cyber-platform"
version = "0.7.0"
description = "Local Arabic cyber research workbench for Linux"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.2"]

[project.scripts]
was-platform = "cyber_platform.__main__:main"

[tool.setuptools.package-data]
cyber_platform = ["catalog.json", "requirements.json", "static/*"]

[tool.setuptools.packages.find]
include = ["cyber_platform*"]
